<link rel="stylesheet" href="/nibbl.css">
<style>
section{padding:48px 0 96px}
.head{max-width:640px;margin-bottom:32px}
.head h1{font-size:clamp(36px,5vw,56px)}
.head p{margin-top:16px;color:#c9d3df}
.rule{color:var(--silver);font-size:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:32px;text-decoration:none;color:inherit}
a.hero:hover .hn{text-decoration:underline;text-decoration-thickness:2px}
.hero img{width:192px;height:192px;image-rendering:pixelated;background:#232740;display:block}
.hero .lbl{color:var(--slate)}
.hn{font:500 clamp(30px,5vw,48px)/1.1 var(--f-head);overflow-wrap:anywhere;margin:6px 0}
.gain{font-family:var(--f-label);font-size:18px;color:var(--yellow);margin-top:8px}
.cd{margin-top:20px;color:var(--silver);font-size:14px}
.cd b{font-family:var(--f-label);color:var(--white);font-size:16px;font-weight:400}
h2.sub{font:500 28px/1.2 var(--f-head);margin:48px 0 16px}
.list{padding:8px 0}
.wrow{display:grid;grid-template-columns:32px 1fr auto auto;gap:16px;align-items:center;padding:12px 24px;border-bottom:2px dashed #2a3044;text-decoration:none;color:inherit}
.wrow:last-child{border-bottom:0}
a.wrow:hover{background:#20243a}
a.wrow:hover .nm{text-decoration:underline}
.wrow .rk{font-family:var(--f-label);color:var(--slate)}
.wrow .nm{font:500 22px/1.1 var(--f-head);overflow-wrap:anywhere}
.wrow .nm .lbl{color:var(--slate);margin-left:6px;font-size:14px}
.wrow .g{font-family:var(--f-label);color:var(--yellow);white-space:nowrap}
.empty{padding:32px 24px;text-align:center;color:var(--silver)}
footer{padding:48px 0;border-top:4px solid #1a1c2c}
.fbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--slate);font-size:13px}
.fbar a{color:var(--silver)}
@media (max-width:760px){
  nav .links a:not(.gh){display:none}
  section{padding:24px 0 64px}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:24px 16px}
  .hero img{width:160px;height:160px}
  .wrow{grid-template-columns:24px 1fr auto;gap:10px;padding:12px}
  .wrow .tg{display:none}
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Nibbl home"><canvas id="logo" role="img" aria-label="Nibbl logo pet"></canvas><b>nibbl</b></a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/leaderboard/">Leaderboard</a>
      <a href="/week/">Week</a>
      <a href="/#install">Install</a>
    </div>
  </div>
</nav>

<main>
<section>
  <div class="wrap">
    <div class="head">
      <h1>Nibbl of the week</h1>
      <p class="rule">Most XP gained Monday to Sunday (UTC). Real nibbls only.</p>
    </div>

    <div id="hero" aria-live="polite"></div>

    <h2 class="sub" id="ruh" hidden>Runners-up</h2>
    <div class="list px" id="runners" hidden></div>

    <h2 class="sub">Past winners</h2>
    <div class="list px" id="winners"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="fbar"><span>Nibbl is a Claude Code mod.</span><span><a href="/privacy/">Privacy</a> · <a href="/">Back to the landing page</a></span></div>
  </div>
</footer>

<script src="/nibbl.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
mountSprite($('logo'),genome(42),{scale:()=>2,poke:true,life:9});
startLoop();

const apiGet=path=>fetch(path,{headers:{accept:'application/json'},signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok) throw 0;return r.json();});
const fmtN=n=>String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const nameOf=e=>e.name||('#'+pad6(e.serial));
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls) n.className=cls;if(text!=null) n.textContent=text;return n;};
function tierBadge(e){
  const w=el('span','tg');
  const b=el('span','badge t-'+String(e.tier||'common').replace(/[^a-z]/g,''),e.tier||'common');w.appendChild(b);
  if(e.shiny) w.appendChild(el('span','badge t-shiny','shiny'));
  return w;
}
function weekLabel(w){return String(w||'').replace('-',' ');}

function renderHero(leader,endsAt){
  const host=$('hero');host.textContent='';
  if(!leader){
    const d=el('div','empty px');
    d.appendChild(el('b',null,'The week just started. Keep coding.'));
    host.appendChild(d);
  }else{
    const a=el('a','hero px');a.href=cardUrl(leader.serial);
    a.setAttribute('aria-label','Leader this week: '+nameOf(leader)+', open card');
    const img=el('img');img.src='/p/'+pad6(leader.serial)+'.png';img.alt=nameOf(leader);img.width=192;img.height=192;img.style.imageRendering='pixelated';
    const t=el('div');
    t.appendChild(el('div','lbl','LEADING THIS WEEK'));
    const n=el('div','hn',nameOf(leader));t.appendChild(n);
    const sub=el('div');sub.appendChild(el('span','lbl','#'+pad6(leader.serial)+' '));sub.appendChild(tierBadge(leader));t.appendChild(sub);
    t.appendChild(el('div','gain','+'+fmtN(leader.gain)+' xp this week'));
    const cd=el('div','cd');cd.appendChild(document.createTextNode('Ends in '));cd.appendChild(el('b',null,'')).id='cdv';cd.appendChild(document.createTextNode(' (Mon 00:00 UTC)'));t.appendChild(cd);
    a.appendChild(img);a.appendChild(t);host.appendChild(a);
  }
  if(!leader&&endsAt){
    const cd=el('p','cd');cd.appendChild(document.createTextNode('Ends in '));const b=el('b',null,'');b.id='cdv';cd.appendChild(b);cd.appendChild(document.createTextNode(' (Mon 00:00 UTC)'));host.appendChild(cd);
  }
}
function startCountdown(endsAt){
  const v=$('cdv');if(!v||!Number.isFinite(endsAt)) return;
  const tick=()=>{
    let s=Math.max(0,Math.floor((endsAt-Date.now())/1000));
    const d=Math.floor(s/86400);s%=86400;
    const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
    const p=n=>String(n).padStart(2,'0');
    v.textContent=(d?d+'d ':'')+p(h)+':'+p(m)+':'+p(s);
  };
  tick();setInterval(tick,1000);
}
function renderRunners(list){
  if(!list.length) return;
  $('ruh').hidden=false;const host=$('runners');host.hidden=false;
  list.forEach((e,i)=>{
    const a=el('a','wrow');a.href=cardUrl(e.serial);
    a.appendChild(el('span','rk',String(i+2)));
    const nm=el('span','nm',nameOf(e));if(e.name) nm.appendChild(el('span','lbl','#'+pad6(e.serial)));a.appendChild(nm);
    a.appendChild(tierBadge(e));
    a.appendChild(el('span','g','+'+fmtN(e.gain)+' xp'));
    host.appendChild(a);
  });
}
function renderWinners(list){
  const host=$('winners');host.textContent='';
  if(!list.length){host.appendChild(el('div','empty','The first Nibbl of the week is crowned on Monday 00:00 UTC.'));return;}
  list.forEach(e=>{
    const a=el('a','wrow');a.href=cardUrl(e.serial);
    a.appendChild(el('span','rk','\u265b'));
    const nm=el('span','nm',nameOf(e));nm.appendChild(el('span','lbl',weekLabel(e.week)));a.appendChild(nm);
    a.appendChild(tierBadge(e));
    a.appendChild(el('span','g',e.retro?'retro, '+fmtN(e.gain)+' xp':'+'+fmtN(e.gain)+' xp'));
    host.appendChild(a);
  });
  const g=el('div','wrow');g.appendChild(el('span','rk','\u00b7'));
  const gn=el('span','nm','Genesis week');gn.appendChild(el('span','lbl',weekLabel('2026-W40')));g.appendChild(gn);
  g.appendChild(el('span','g','no crown'));host.appendChild(g);
  if(list.some(e=>e.retro)) host.appendChild(el('div','empty','Retro crowns cover the weeks before the weekly snapshot started on 14 October. They go to the nibbl that had the most XP on 14 October among those hatched by the end of that week. The maker\u2019s own pet is left out.'));
}
apiGet('/api/week').then(j=>{
  const leaders=Array.isArray(j.leaders)?j.leaders:[];
  const winners=Array.isArray(j.winners)?j.winners:[];
  renderHero(leaders[0]||null,j.endsAt);
  renderRunners(leaders.slice(1));
  renderWinners(winners);
  startCountdown(Number(j.endsAt));
}).catch(()=>{
  const d=el('div','empty px');d.appendChild(el('b',null,'The board is napping.'));d.appendChild(el('span',null,'We could not load this week right now. Try again in a minute.'));
  $('hero').textContent='';$('hero').appendChild(d);
  renderWinners([]);
});
</script>
</body>
</html>
