<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/nibbl.css">
<style>
section{padding:32px 0 96px}
.lost{max-width:760px;margin:0 auto;text-align:center}
.lost h1{font-size:clamp(32px,6vw,56px);text-wrap:balance;margin-top:40px}
.lost .sub{margin-top:12px;color:#c9d3df}
.lost .path{margin:20px auto 0;display:inline-block;max-width:100%;padding:8px 12px;background:#0b0d16;border:2px dashed var(--line);color:var(--yellow);font:400 13px/1.4 var(--f-body);overflow-wrap:anywhere;text-align:left}
.lost .path:empty{display:none}
.scene{--bg:var(--lcd-1);--bd:var(--dusk);position:relative;height:220px;overflow:hidden;margin:16px 4px 0}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(31,36,24,.07) 0 2px,transparent 2px 4px)}
.ground{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--lcd-2);border-top:4px solid var(--lcd-3)}
.crumb{position:absolute;background:var(--lcd-3);width:var(--s);height:var(--s);box-shadow:inset calc(var(--s)*-.25) calc(var(--s)*-.25) 0 var(--lcd-4)}
.pet{position:absolute;bottom:20px;left:0;width:96px;will-change:transform}
.pet canvas{position:relative}
.pet .flip{transform:scaleX(-1)}
.bubble{position:absolute;left:50%;bottom:100%;margin-bottom:-4px;transform:translateX(-50%)}
.bubble canvas{margin:0 auto}
.acts{margin-top:40px;display:flex;gap:12px 16px;justify-content:center;flex-wrap:wrap}
.links2{margin-top:24px;display:flex;gap:8px 20px;justify-content:center;flex-wrap:wrap;font-size:14px}
.links2 a{color:var(--yellow)}
footer{padding:48px 0;border-top:4px solid #1a1c2c}
.fbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--slate);font-size:13px}
.fbar a{color:var(--silver)}
@media (max-width:760px){nav .links a:not(.gh){display:none}section{padding:16px 0 64px}.scene{height:190px}.pet{width:64px}}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Nibbl home"><canvas id="logo" role="img" aria-label="Nibbl logo pet"></canvas><b>nibbl</b></a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/leaderboard/">Leaderboard</a>
      <a href="/#install">Install</a>
    </div>
  </div>
</nav>

<main>
<section>
  <div class="wrap lost">
    <div class="scene px" id="scene" aria-label="A small pixel pet wandering around, lost">
      <div class="ground"></div>
      <div class="pet" id="pet">
        <div class="bubble" aria-hidden="true"><canvas id="q"></canvas></div>
        <canvas id="sprite" role="img" aria-label="A lost nibbl"></canvas>
      </div>
    </div>
    <h1>404: this page got nibbled</h1>
    <p class="sub">Your nibbl ate it. It does that with bugs too.</p>
    <code class="path" id="path"></code>
    <div class="acts"><button class="btn" id="petit" type="button">Pet it</button></div>
    <div class="links2">
      <a href="/">Home</a>
      <a href="/leaderboard/">Leaderboard</a>
      <a href="/week/">Nibbl of the week</a>
      <a href="/#install">Install</a>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="fbar"><span>Nibbl is a Claude Code mod. Not affiliated with Anthropic.</span><a href="/">Back to the landing page</a></div>
  </div>
</footer>

<script src="/nibbl.js"></script>
<script>
"use strict";
mountSprite(document.getElementById('logo'),genome(42),{scale:()=>2,poke:true,life:9});
document.getElementById('path').textContent=location.pathname+location.search;

var seed=1+Math.floor(Math.random()*999999);
var sc=function(){return innerWidth<760?4:6;};
var sprite=document.getElementById('sprite');
mountSprite(sprite,genome(seed),{scale:sc,poke:true,life:seed});
startLoop();

/* pixel "?" speech bubble, drawn once on a 2d canvas */
(function(){
  var rows=[
    '..#########..',
    '.#fffffffff#.',
    '#fffff##ffff#',
    '#ffff#ff#fff#',
    '#ffffffff#ff#',
    '#fffff###fff#',
    '#fffff#ffff#.',
    '#ffffffffff#.',
    '.#fffff#ff#..',
    '..#######.#..',
    '........##...'
  ];
  var c=document.getElementById('q'),k=4;
  c.width=rows[0].length*k;c.height=rows.length*k;
  c.style.width=c.width+'px';c.style.height=c.height+'px';
  var x=c.getContext('2d');
  rows.forEach(function(r,j){for(var i=0;i<r.length;i++){
    var ch=r[i];if(ch==='.')continue;
    x.fillStyle=ch==='#'?'#1a1c2c':'#f4f4f4';x.fillRect(i*k,j*k,k,k);
  }});
})();

/* crumbs of the nibbled page */
(function(){
  var scene=document.getElementById('scene'),n=14;
  for(var i=0;i<n;i++){
    var d=document.createElement('i');d.className='crumb';d.setAttribute('aria-hidden','true');
    var s=[4,4,8,8,12][Math.floor(Math.random()*5)];
    d.style.setProperty('--s',s+'px');
    d.style.left=(4+Math.random()*92)+'%';
    d.style.bottom=(4+Math.floor(Math.random()*5)*4)+'px';
    scene.appendChild(d);
  }
})();

/* wandering */
(function(){
  var scene=document.getElementById('scene'),pet=document.getElementById('pet');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var x=0,dir=1,target=null,wait=0,last=performance.now();
  function bounds(){return Math.max(0,scene.clientWidth-pet.offsetWidth-16);}
  function place(){pet.style.transform='translateX('+Math.round(x)+'px)';sprite.classList.toggle('flip',dir<0);}
  x=bounds()/2;place();
  if(reduce)return;
  function tick(t){
    var dt=Math.min(100,t-last)/1000;last=t;
    var max=bounds();
    if(wait>0){wait-=dt;}
    else{
      if(target===null)target=8+Math.random()*max;
      var d=target-x;
      if(Math.abs(d)<2){target=null;wait=0.8+Math.random()*2;}
      else{dir=d>0?1:-1;x+=dir*Math.min(Math.abs(d),44*dt);}
    }
    if(x>max)x=max;
    place();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

document.getElementById('petit').addEventListener('click',function(){
  var r=sprite.getBoundingClientRect();
  sprite.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/3}));
});
</script>
</body>
