<link rel="stylesheet" href="/nibbl.css">
<style>
section{padding:48px 0 96px}
.head{max-width:640px;margin-bottom:40px}
.head h1{font-size:clamp(36px,5vw,56px)}
.head p{margin-top:16px;color:#c9d3df}
.lb{padding:8px 0}
.lrow{display:grid;grid-template-columns:56px 56px 1fr 120px 72px 220px;gap:16px;align-items:center;padding:10px 24px;border-bottom:2px dashed #2a3044;text-decoration:none}
a.lrow:hover{background:#20243a}
a.lrow:hover .nm b{text-decoration:underline;text-decoration-thickness:2px}
a.lrow:focus-visible{outline-offset:-4px}
.lrow:last-child{border-bottom:0}
.lrow.h{padding-top:16px;padding-bottom:12px;color:var(--slate)}
.lrow .rk{font-family:var(--f-label);color:var(--slate);white-space:nowrap}
.lrow .rk.top{color:var(--yellow)}
.lrow .nm{min-width:0}
.lrow .nm b{font:500 24px/1.1 var(--f-head);overflow-wrap:anywhere}
.lrow .nm .lbl{color:var(--slate);margin-left:6px}
.lrow .br{font-size:13px;color:#c9d3df;overflow-wrap:anywhere}
.lrow .lv{font-family:var(--f-label);font-size:14px;white-space:nowrap}
.lrow .tg{display:flex;flex-wrap:wrap;gap:4px}
.lrow.me{background:#232740;box-shadow:inset 4px 0 0 0 var(--accent)}
.lrow.me .nm b{color:var(--yellow)}
.lrow.ghost{opacity:.7;border-bottom:0;border-top:2px dashed #2a3044}
.lrow.ghost .nm b{color:var(--silver)}
.lrow.gap{border-bottom:0;padding-top:4px;padding-bottom:4px}
.lrow.gap .rk{color:var(--silver)}
.empty{padding:40px 24px;text-align:center;color:var(--silver)}
.empty b{display:block;font:500 28px/1.2 var(--f-head);color:var(--white);margin-bottom:8px}
.empty canvas{margin:0 auto 16px}
.lb-foot{margin-top:32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--silver)}
.lb-foot a{color:var(--silver)}
footer{padding:48px 0;border-top:4px solid #1a1c2c}
.fbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--slate);font-size:13px}
.fbar a{color:var(--silver)}
@media (max-width:1040px){
  .lrow{grid-template-columns:48px 56px 1fr 72px 200px}
  .lrow .br{display:none}
}
@media (max-width:760px){
  nav .links a:not(.gh){display:none}
  section{padding:24px 0 64px}
  .head{margin-bottom:32px}
  .lrow{grid-template-columns:36px 40px 1fr auto;gap:10px;padding:10px 12px}
  .lrow .rk{font-size:12px}
  .lrow .lv{grid-column:4;grid-row:1}
  .lrow .tg{grid-column:3 / 5;grid-row:2;margin-top:-4px}
  .lrow.h{display:none}
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Nibbl home"><canvas id="logo" role="img" aria-label="Nibbl logo pet"></canvas><b>nibbl</b></a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/#install">Install</a>
    </div>
  </div>
</nav>

<main>
<section>
  <div class="wrap">
    <div class="head">
      <h1>Leaderboard</h1>
      <p>The top 100 nibbls by XP, refreshed every few minutes. Every serial number is issued once and never reused. Open any row for its card.</p>
    </div>
    <div class="lb px" id="lb" aria-live="polite">
      <div class="lrow h lbl"><span>#</span><span></span><span>nibbl</span><span>form</span><span>lvl</span><span>tier</span></div>
    </div>
    <div class="lb-foot" id="lbfoot" hidden><span id="mehint"></span><a href="/leaderboard" id="notme" hidden>this is not me</a></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="fbar"><span>Nibbl is a Claude Code mod.</span><a href="/">Back to the landing page</a></div>
  </div>
</footer>

<script src="/nibbl.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const small=()=>innerWidth<760;
mountSprite($('logo'),genome(42),{scale:()=>2,poke:true,life:9});
startLoop();

const ME_KEY='nibbl.me';
const parseSerial=v=>{v=String(v==null?'':v).trim();if(!/^\d{1,6}$/.test(v)) return 0;return Number(v);};
function storeMe(n){try{localStorage.setItem(ME_KEY,String(n));}catch(e){}}
function clearMe(){try{localStorage.removeItem(ME_KEY);}catch(e){}}
function loadMe(){try{return parseSerial(localStorage.getItem(ME_KEY));}catch(e){return 0;}}
// ?me= wins and is remembered; otherwise fall back to the saved serial.
function resolveMe(){
  const q=parseSerial(new URLSearchParams(location.search).get('me'));
  if(q){storeMe(q);return q;}
  return loadMe();
}

const apiGet=path=>fetch(path,{headers:{accept:'application/json'},signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok) throw 0;return r.json();});
const fmtRank=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const host=$('lb');
let mi=0;

function rowOf(e,opts){
  opts=opts||{};
  const name=e.name||'nibbl', id=pad6(e.serial), label=e.label||'';
  const a=document.createElement('a');a.className='lrow'+(opts.me?' me':'');a.href=cardUrl(e.serial);
  a.setAttribute('aria-label',name+' #'+id+', rank '+e.rank+', level '+e.level+', open card'+(opts.me?' (you)':''));
  const tags='<span class="badge t-'+esc(e.tier)+'">'+esc(e.tier)+'</span>'+(e.shiny?'<span class="badge t-shiny">shiny</span>':'')+(e.genesis?'<span class="badge t-genesis">genesis</span>':'')+(opts.me?'<span class="badge t-preview">you</span>':'');
  a.innerHTML='<span class="rk'+(e.rank<=3?' top':'')+'">'+fmtRank(e.rank)+'</span><canvas role="img" aria-label="'+esc(name)+'. Click to pet."></canvas><span class="nm"><b>'+esc(name)+'</b><span class="lbl">#'+id+'</span></span><span class="br">'+esc(label)+'</span><span class="lv">lvl '+Number(e.level)+'</span><span class="tg">'+tags+'</span>';
  host.appendChild(a);
  mountSprite(a.querySelector('canvas'),genome(e.seed,e.shiny?{shiny:true}:undefined),{poke:'stop',phase:(mi++)*170,life:500+e.serial});
  return a;
}
function mountEgg(cv){
  mount(cv,{w:16,h:16,poke:true,cssHop:true,scale:()=>small()?2:3,draw:t=>{const f=REDUCED?0:Math.floor(t/400)%8;const w=f<4?0:[-1,1,-1,1][f-4];const G=grid(16,16);blit(G,EGG,4+w,5);return G;}});
}
function gapRow(){
  const g=document.createElement('div');g.className='lrow gap';
  g.innerHTML='<span class="rk">\u2026</span><span></span><span class="nm lbl" style="margin:0">\u2026</span>';
  host.appendChild(g);
}
function ghostRow(text){
  const gh=document.createElement('div');gh.className='lrow ghost';
  gh.innerHTML='<span class="rk">\u2026</span><canvas role="img" aria-label="An egg"></canvas><span class="nm"><b>'+esc(text||'your nibbl could be here')+'</b></span>';
  host.appendChild(gh);mountEgg(gh.querySelector('canvas'));
}
function emptyState(){
  host.innerHTML='';
  const d=document.createElement('div');d.className='empty';
  d.innerHTML='<canvas role="img" aria-label="An egg"></canvas><b>The board is napping.</b><span>We could not load the ranking right now. Try again in a minute.</span>';
  host.appendChild(d);mountEgg(d.querySelector('canvas'));
}
function footer(me,state){
  const f=$('lbfoot'),hint=$('mehint'),nm=$('notme');
  f.hidden=false;
  if(me){nm.hidden=false;hint.textContent=state==='missing'?'No visible nibbl with serial #'+pad6(me)+'.':'Showing you as #'+pad6(me)+'.';}
  else{nm.hidden=true;hint.textContent='Open your card at /p/<serial> and tap "See its rank" to find yourself here.';}
}

async function main(){
  const me=resolveMe();
  let board;
  try{board=await apiGet('/api/leaderboard');}catch(e){board=null;}
  const entries=board&&Array.isArray(board.entries)?board.entries.slice(0,100):[];
  if(!entries.length){emptyState();return;}
  let inTop=false;
  entries.forEach(e=>{const mine=me&&e.serial===me;if(mine) inTop=true;const row=rowOf(e,{me:mine});if(mine&&!REDUCED) setTimeout(()=>row.scrollIntoView({block:'center'}),50);});
  let state='top';
  if(!me){ghostRow();state='none';}
  else if(!inTop){
    let mine=null;
    try{mine=await apiGet('/api/rank/'+me);}catch(e){mine=null;}
    if(mine&&Number.isFinite(mine.rank)){gapRow();rowOf(mine,{me:true});state='below';}
    else{ghostRow();state='missing';}
  }
  footer(me,state);
}
$('notme').addEventListener('click',e=>{e.preventDefault();clearMe();location.replace('/leaderboard');});
main().catch(emptyState);
</script>
</body>
