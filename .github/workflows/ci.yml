name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/mod typechecks against Claude Code plugin types that only exist on a machine running Claude Code
      - run: pnpm -r --filter '!@nibbl/mod' typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high
